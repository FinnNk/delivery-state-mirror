apiVersion: v1
kind: Namespace
metadata:
  name: lab-delivery-release-check
  labels:
    lab: search-spike
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-boundary
  namespace: lab-delivery-release-check
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lab-evaluation
      podSelector:
        matchExpressions:
        - key: lab
          operator: In
          values:
          - gatling
          - evaluator
    ports:
    - port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform
      podSelector:
        matchLabels:
          elasticsearch.k8s.elastic.co/cluster-name: shared
    ports:
    - port: 9200
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: environment
  namespace: lab-delivery-release-check
spec:
  hard:
    pods: '3'
    requests.cpu: 250m
    requests.memory: 128Mi
    limits.cpu: '1'
    limits.memory: 384Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-search-ingress
  namespace: lab-delivery-release-check
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lab-control
      podSelector:
        matchLabels:
          app: lab-control
    ports:
    - port: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: search-blue
  namespace: lab-delivery-release-check
spec:
  selector:
    app: search
    release-slot: blue
  ports:
  - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-blue
  namespace: lab-delivery-release-check
  annotations:
    lab/fingerprint: 7d99e451865ef138e725c35391b0139c1ac26721b9179d8837cabdee32732031
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
      release-slot: blue
  template:
    metadata:
      labels:
        app: search
        release-slot: blue
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: nexus-read
      containers:
      - name: api
        image: nexus.localhost:18185/search-api@sha256:07a43b5d090ebd2429ec14c9c1a2203669ae3dd9ec9d8e254ff9693945bde93a
        imagePullPolicy: IfNotPresent
        env:
        - name: ES_URL
          value: https://shared-es-http.platform.svc:9200
        - name: ES_INDEX
          value: esci-gb-v1-rc5f6d204c4467d4c49f842e3
        envFrom:
        - secretRef:
            name: search-access
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 1
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: es-ca
          mountPath: /es-ca
          readOnly: true
      volumes:
      - name: es-ca
        secret:
          secretName: es-ca
---
