---
# Source: search-spike/templates/environment.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: lab-delivery-staging
  labels:
    lab: search-spike

---
# Source: search-spike/templates/environment.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-boundary
  namespace: lab-delivery-staging
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lab-evaluation
          podSelector:
            matchExpressions:
              - {key: lab, operator: In, values: [gatling, evaluator]}
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
          podSelector:
            matchLabels:
              elasticsearch.k8s.elastic.co/cluster-name: shared
      ports:
        - port: 9200

---
# Source: search-spike/templates/environment.yaml
apiVersion: v1
kind: ResourceQuota
metadata:
  name: environment
  namespace: lab-delivery-staging
spec:
  hard:
    pods: '3'
    requests.cpu: 250m
    requests.memory: 128Mi
    limits.cpu: '1'
    limits.memory: 384Mi

---
# Source: search-spike/templates/environment.yaml
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: lab-delivery-staging
spec:
  selector:
    app: search
  ports:
    - port: 8080

---
# Source: search-spike/templates/environment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: lab-delivery-staging
  annotations:
    lab/fingerprint: "00cd57233b8a30a6e452a82e7237e97892553c1408af21fc9aa1deb7e2845dea"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: nexus-read
      containers:
        - name: api
          image: "nexus.localhost:18185/search-api@sha256:eb24a2fb8f9fdcd905c9abf230e0bcedd4393ce1939b469c601b2af1243a7613"
          imagePullPolicy: IfNotPresent
          env:
            - name: ES_URL
              value: https://shared-es-http.platform.svc:9200
            - name: ES_INDEX
              value: "retail-gb-1m-v1"
          envFrom:
            - secretRef:
                name: search-access
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: es-ca
              mountPath: /es-ca
              readOnly: true
      volumes:
        - name: es-ca
          secret:
            secretName: es-ca
---
